[package]
name = "autodubstudio"
version = "0.1.0"
description = "AutoDubStudio Local AI Video Dubbing"
authors = ["AutoDubStudio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "window-unmaximize", "window-maximize", "window-close", "window-minimize", "protocol-asset", "dialog-open", "shell-sidecar", "shell-execute", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
